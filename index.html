<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VisionaryZ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="gradient-bg"></div>
  <div class="container">
    <div class="page" id="welcomePage">
      <h1>Witaj w VisionaryZ</h1>
      <h3>Twój luksusowy dzień zaczyna się teraz</h3>
      <button onclick="startDay()">Zaczynamy</button>
    </div>

    <div class="page hidden" id="planPage">
      <h1>Plan dnia zwycięzcy</h1>
      <ul id="planList"></ul>
      <h2>Twoje cele na dziś</h2>
      <ul id="goalsList"></ul>
      <button onclick="speakPlan()">Odtwórz głosowo plan</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
